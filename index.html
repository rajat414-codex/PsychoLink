    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ════════════════════════════════════════════════════════
         BACKEND (Render) — permanent live backend
         ════════════════════════════════════════════════════════ -->
    <script>
      // 👇 Render backend URL (permanent)
      window.API_BASE = "https://psycholink.onrender.com";

      // Auto-rewrite: saari localhost:3001 calls ko Railway backend pe bhejta hai (bypass if local=true in URL or use_local=true in localStorage)
      (function () {
        var _fetch = window.fetch;
        window.fetch = function (url, opts) {
          var isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
          if (isLocalHost || localStorage.getItem('use_local') === 'true' || window.location.search.includes('local=true')) {
            return _fetch(url, opts);
          }
          if (window.API_BASE && typeof url === 'string' && url.indexOf('localhost:3001') !== -1) {
            url = url.replace('http://localhost:3001', window.API_BASE)
                     .replace('https://localhost:3001', window.API_BASE);
          }
          return _fetch(url, opts);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
